name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies (client)
        run: |
          cd client
          npm install
      - name: Run Jest tests (client)
        run: |
          cd client
          npm test
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies (model)
        run: |
          cd model
          pip install -r requirements.txt
      - name: Run PyTest (model)
        run: |
          cd model
          pytest tests/
